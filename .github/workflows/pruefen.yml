# Läuft bei jedem Push und jedem Pull Request: Typprüfung, Tests, Build.
# Der Job heißt „pruefen“ – diesen Namen trägst du im Branch-Schutz für main als Pflichtprüfung ein.
name: Prüfen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # Version kommt aus "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
